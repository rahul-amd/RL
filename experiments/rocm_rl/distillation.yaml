defaults: ../../examples/configs/distillation_math.yaml
distillation:
  num_prompts_per_step: 4
  num_generations_per_prompt: 1
  max_num_steps: 3
  max_num_epochs: 2
  topk_logits_k: 64
  val_period: -1
  val_at_start: false
  val_at_end: false
loss_fn:
  kl_type: reverse
policy:
  model_name: Qwen/Qwen3-1.7B
  tokenizer:
    chat_template_kwargs:
      enable_thinking: false
  train_global_batch_size: 4
  train_micro_batch_size: 1
  generation_batch_size: 4
  logprob_batch_size: 1
  max_total_sequence_length: 512
  dtensor_cfg:
    _v2: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    activation_checkpointing: false
  dynamic_batching:
    enabled: false
  sequence_packing:
    enabled: false
  generation:
    max_new_tokens: 256
    vllm_cfg:
      enable_prefix_caching: false
      gpu_memory_utilization: 0.3
      enforce_eager: true
    vllm_kwargs:
      max_num_seqs: 16
  optimizer:
    kwargs:
      lr: 0.000005
teacher:
  model_name: Qwen/Qwen3-4B
  tokenizer:
    name: Qwen/Qwen3-4B
  train_global_batch_size: 4
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 512
  dtensor_cfg:
    _v2: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    activation_checkpointing: false
  dynamic_batching:
    enabled: false
  sequence_packing:
    enabled: false
checkpointing:
  save_period: 3
  keep_top_k: 1
  metric_name: train:loss
  higher_is_better: false
  model_save_format: null
data:
  train:
    _override_: true
    dataset_name: ResponseDataset
    data_path: experiments/rocm_rl/train.jsonl
  validation: null
  default:
    prompt_file: null
    processor: math_hf_data_processor
    env_name: math
env:
  math:
    num_workers: 1
logger:
  wandb_enabled: false
  tensorboard_enabled: false
  monitor_gpus: false
  num_val_samples_to_print: 2
cluster:
  gpus_per_node: 1
