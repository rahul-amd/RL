defaults: ../../examples/configs/distillation_math.yaml
distillation:
  num_prompts_per_step: 512
  num_generations_per_prompt: 4
  max_num_steps: 100
  max_num_epochs: 1
  val_period: 0
  val_at_start: false
  val_at_end: false
  topk_logits_k: 0
  seed: 42
loss_fn:
  kl_type: sampled_reverse
  sampled_token_reduction: sum
policy:
  initialization_seed: 42
  model_name: /shared_silo/scratch/hf_cache/hub/models--Qwen--Qwen3-8B-Base/snapshots/49e3418fbbbca6ecbdf9608b4d22e5a407081db4
  tokenizer:
    chat_template: experiments/tml_opd_replication/qwen3_historical.jinja
  train_global_batch_size: 2048
  train_micro_batch_size: 1
  max_total_sequence_length: 5184
  max_grad_norm: .inf
  logprob_chunk_size: 256
  dtensor_cfg:
    _v2: true
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    dp_replicate_size: 1
    automodel_kwargs:
      force_hf: true
    lora_cfg:
      enabled: true
      match_all_linear: false
      exclude_modules: []
      dropout_position: post
      target_modules: ['*.q_proj', '*.k_proj', '*.v_proj', '*.o_proj', '*.gate_proj', '*.up_proj', '*.down_proj', lm_head]
      dim: 128
      alpha: 32
      dropout: 0.0
      lora_A_init: uniform
      use_triton: false
      restore_from: /shared_silo/scratch/rahul.aralikatte@amd.com/RL/experiments/tml_opd_replication/run_49416/checkpoints/step_3000/policy/weights/model
  dynamic_batching:
    enabled: false
  sequence_packing:
    enabled: true
    train_mb_tokens: 16384
    logprob_mb_tokens: 16384
  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 0.0001
      weight_decay: 0.0
      betas: [0.9, 0.95]
      eps: 1.0e-8
  scheduler:
    - name: torch.optim.lr_scheduler.ConstantLR
      kwargs:
        factor: 1.0
        total_iters: 100
    - milestones: []
  generation:
    max_new_tokens: 4096
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_strings: ['<|im_end|>']
    stop_token_ids: [151645]
    colocated:
      enabled: false
      resources:
        num_nodes: 1
        gpus_per_node: 4
    vllm_cfg:
      gpu_memory_utilization: 0.80
      enforce_eager: true
      tensor_parallel_size: 1
      async_engine: false
    vllm_kwargs:
      max_num_seqs: 64
      generation_config: vllm
teacher:
  model_name: /shared_silo/scratch/hf_cache/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
  tokenizer:
    chat_template: experiments/tml_opd_replication/qwen3_historical.jinja
  max_total_sequence_length: 5184
  logprob_chunk_size: 256
  dtensor_cfg:
    _v2: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    dp_replicate_size: 1
    automodel_kwargs:
      force_hf: true
  dynamic_batching:
    enabled: false
  sequence_packing:
    enabled: true
    train_mb_tokens: 16384
    logprob_mb_tokens: 16384
  generation:
    temperature: 1.0
    top_p: 1.0
    top_k: null
data:
  shuffle: false
  tokenized_path: experiments/tml_opd_replication/data/deepmath_historical.jsonl
  validation: null
env:
  _override_: true
checkpointing:
  checkpoint_dir: experiments/tml_opd_replication/checkpoints/opd
  save_period: 5
  metric_name: train:teacher_kl
  higher_is_better: false
  keep_top_k: null
logger:
  log_dir: experiments/tml_opd_replication/logs/opd
  wandb_enabled: true
  tensorboard_enabled: false
  monitor_gpus: false
  num_val_samples_to_print: 0
  wandb:
    project: opd-tests
    name: tml-opd-r128
    id: tml-opd-r128
    resume: allow
cluster:
  num_nodes: 1
  gpus_per_node: 8
